name: Create Windows Release

on:
  push:
    tags: ['v*']

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: oracle
  APP_NAME: WCode
  APP_VENDOR: TuanDev
  # Mã nguồn ở repo này; bản phát hành (installer) đẩy sang repo release riêng.
  RELEASE_REPO: tuanworlddev/wcode-relatest

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}

      - name: Extract version from tag
        shell: bash
        run: |
          APP_VERSION=${GITHUB_REF#refs/tags/v}
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Building version $APP_VERSION"

      - name: Run tests and build
        shell: bash
        run: ./mvnw.cmd -B -Dapp.version="${{ env.APP_VERSION }}" -Dapp.vendor="${{ env.APP_VENDOR }}" clean verify

      - name: Resolve built JAR
        shell: bash
        run: |
          APP_JAR=$(find target -maxdepth 1 -type f -name 'FBSBarcode-*.jar' | head -n 1)
          if [ -z "$APP_JAR" ]; then
            echo "No built application JAR found in target/"
            exit 1
          fi
          APP_JAR=$(basename "$APP_JAR")
          echo "APP_JAR=$APP_JAR" >> "$GITHUB_ENV"

      - name: Prepare jpackage input
        shell: bash
        run: |
          rm -rf target/jpackage-input
          mkdir -p target/jpackage-input/lib
          cp "target/${APP_JAR}" "target/jpackage-input/${APP_JAR}"
          cp -R target/lib/. target/jpackage-input/lib/

      - name: Build EXE installer
        shell: bash
        run: |
          mkdir -p out
          jpackage --type exe \
            --name "${{ env.APP_NAME }}" \
            --input target/jpackage-input \
            --main-jar "${{ env.APP_JAR }}" \
            --main-class com.tuandev.fbsbarcode.Launcher \
            --dest out \
            --app-version "${{ env.APP_VERSION }}" \
            --vendor "${{ env.APP_VENDOR }}" \
            --icon src/main/resources/com/tuandev/fbsbarcode/assets/images/logo.ico \
            --win-menu \
            --win-shortcut \
            --win-per-user-install \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --java-options "-Djavafx.cachedir=C:\\ProgramData\\WCode\\openjfx-cache" \
            --java-options "-Djava.io.tmpdir=C:\\ProgramData\\WCode\\tmp" \
            --java-options "-Dorg.sqlite.tmpdir=C:\\ProgramData\\WCode\\tmp" \
            --jlink-options "--strip-native-commands --strip-debug --no-man-pages --no-header-files --bind-services"
          mv "$(find out -maxdepth 1 -type f -name 'WCode*.exe' | head -n 1)" out/WCode.exe

      - name: Build MSI installer
        shell: bash
        run: |
          jpackage --type msi \
            --name "${{ env.APP_NAME }}" \
            --input target/jpackage-input \
            --main-jar "${{ env.APP_JAR }}" \
            --main-class com.tuandev.fbsbarcode.Launcher \
            --dest out \
            --app-version "${{ env.APP_VERSION }}" \
            --vendor "${{ env.APP_VENDOR }}" \
            --icon src/main/resources/com/tuandev/fbsbarcode/assets/images/logo.ico \
            --win-menu \
            --win-shortcut \
            --win-per-user-install \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --java-options "-Djavafx.cachedir=C:\\ProgramData\\WCode\\openjfx-cache" \
            --java-options "-Djava.io.tmpdir=C:\\ProgramData\\WCode\\tmp" \
            --java-options "-Dorg.sqlite.tmpdir=C:\\ProgramData\\WCode\\tmp" \
            --jlink-options "--strip-native-commands --strip-debug --no-man-pages --no-header-files --bind-services"
          mv "$(find out -maxdepth 1 -type f -name 'WCode*.msi' | head -n 1)" out/WCode.msi

      - name: Build portable ZIP
        shell: bash
        run: |
          jpackage --type app-image \
            --name "${{ env.APP_NAME }}" \
            --input target/jpackage-input \
            --main-jar "${{ env.APP_JAR }}" \
            --main-class com.tuandev.fbsbarcode.Launcher \
            --dest out \
            --app-version "${{ env.APP_VERSION }}" \
            --vendor "${{ env.APP_VENDOR }}" \
            --icon src/main/resources/com/tuandev/fbsbarcode/assets/images/logo.ico \
            --java-options "--enable-native-access=ALL-UNNAMED" \
            --java-options "-Djavafx.cachedir=C:\\ProgramData\\WCode\\openjfx-cache" \
            --java-options "-Djava.io.tmpdir=C:\\ProgramData\\WCode\\tmp" \
            --java-options "-Dorg.sqlite.tmpdir=C:\\ProgramData\\WCode\\tmp" \
            --jlink-options "--strip-native-commands --strip-debug --no-man-pages --no-header-files --bind-services"
          cp check-portable.bat out/WCode/check-portable.bat

      - name: Archive portable app
        shell: pwsh
        run: Compress-Archive -Path "out/WCode/*" -DestinationPath "out/WCode-portable.zip"

      - name: Publish GitHub release (to release repo)
        shell: bash
        env:
          # PAT có quyền contents:write trên repo release (secret RELEASE_TOKEN).
          # github.token mặc định chỉ ghi được repo hiện tại, không ghi được repo khác.
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          NOTES="WCode ${APP_VERSION} — bản phát hành chính thức. Cần license hợp lệ để mua/tự động hóa KIZ (đăng nhập qua wcode.online). In tem hoạt động tự do."
          if gh release view "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release edit "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" --title "WCode ${APP_VERSION}" --notes "$NOTES" --latest
          else
            gh release create "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" --title "WCode ${APP_VERSION}" --notes "$NOTES" --latest
          fi
          gh release upload "$GITHUB_REF_NAME" --repo "$RELEASE_REPO" \
            out/WCode.exe \
            out/WCode.msi \
            out/WCode-portable.zip \
            --clobber
