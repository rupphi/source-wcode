name: Create signed WCode JavaFX release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wcode-release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: oracle
  NODE_VERSION: "22"
  APP_NAME: WCode
  APP_VENDOR: TuanDev
  RELEASE_REPO: rupphi/relatest-wcode
  WINDOWS_UPGRADE_UUID: D0FC7057-DA6C-3181-ADF9-C21DB2C9152A
  TIMESTAMP_URL: http://timestamp.digicert.com

jobs:
  validate:
    name: Validate source release contract
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      should_publish: ${{ steps.release.outputs.should_publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Test JavaFX and release contracts
        run: >-
          node --test
          tools/javafx-production-entrypoint.test.mjs
          tools/release-version.test.mjs
          tools/update-manifest.test.mjs

      - name: Require release source on the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF_TYPE" == "branch" ]]; then
            [[ "$GITHUB_REF_NAME" == "$DEFAULT_BRANCH" ]] || {
              echo "Manual release rehearsals must run from $DEFAULT_BRANCH." >&2
              exit 1
            }
          elif [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH" || {
              echo "Release tags must point to a commit on $DEFAULT_BRANCH." >&2
              exit 1
            }
          else
            echo "Unsupported release ref type: $GITHUB_REF_TYPE" >&2
            exit 1
          fi

      - name: Resolve version from pom.xml
        id: release
        run: node tools/release-version.mjs

  windows:
    name: Build signed Windows x64 JavaFX release
    needs: validate
    runs-on: windows-latest
    environment: release
    env:
      APP_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          cache: maven

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Validate release secrets
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY }}
          UPDATE_MANIFEST_PUBLIC_KEY: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY }}
          UPDATE_SIGNING_PUBLISHER: ${{ secrets.UPDATE_SIGNING_PUBLISHER }}
        run: |
          foreach ($name in @(
            'WINDOWS_SIGNING_CERTIFICATE',
            'WINDOWS_SIGNING_PASSWORD',
            'UPDATE_MANIFEST_PRIVATE_KEY',
            'UPDATE_MANIFEST_PUBLIC_KEY',
            'UPDATE_SIGNING_PUBLISHER'
          )) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required release configuration is missing: $name"
            }
          }
          "RELEASE_PUBLISHED_AT=$((Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ss.fffZ'))" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Test and build JavaFX application
        shell: pwsh
        env:
          UPDATE_MANIFEST_PUBLIC_KEY: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY }}
          UPDATE_SIGNING_PUBLISHER: ${{ secrets.UPDATE_SIGNING_PUBLISHER }}
        run: |
          node --test tools/javafx-production-entrypoint.test.mjs tools/release-version.test.mjs tools/update-manifest.test.mjs
          .\mvnw.cmd -B "-Dapp.version=$env:APP_VERSION" `
            "-Dapp.update.public-key=$env:UPDATE_MANIFEST_PUBLIC_KEY" `
            "-Dapp.update.publisher=$env:UPDATE_SIGNING_PUBLISHER" clean verify
          if (-not (Test-Path "target\FBSBarcode-$env:APP_VERSION.jar" -PathType Leaf)) {
            throw 'The JavaFX application JAR was not created.'
          }

      - name: Build JavaFX app-image
        shell: pwsh
        run: |
          $input = Join-Path $PWD 'target\jpackage-input'
          $imageRoot = Join-Path $PWD 'release-image'
          New-Item -ItemType Directory -Force -Path "$input\lib", $imageRoot | Out-Null
          Copy-Item "target\FBSBarcode-$env:APP_VERSION.jar" $input
          Copy-Item 'target\lib\*' "$input\lib" -Recurse
          jpackage --type app-image --name $env:APP_NAME --input $input `
            --main-jar "FBSBarcode-$env:APP_VERSION.jar" `
            --main-class com.tuandev.fbsbarcode.Launcher `
            --dest $imageRoot --app-version $env:APP_VERSION --vendor $env:APP_VENDOR `
            --icon src\main\resources\com\tuandev\fbsbarcode\assets\images\logo.ico `
            --java-options "--enable-native-access=ALL-UNNAMED" `
            --jlink-options "--strip-native-commands --strip-debug --no-man-pages --no-header-files --bind-services"
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path 'release-image\WCode\WCode.exe' -PathType Leaf)) {
            throw 'jpackage did not create the JavaFX app-image.'
          }
          $configuration = Get-Content 'release-image\WCode\app\WCode.cfg' -Raw
          if ($configuration -notmatch 'com\.tuandev\.fbsbarcode\.Launcher') {
            throw 'The app-image does not launch JavaFX.'
          }

      - name: Sign app-image and build signed installers
        shell: pwsh
        env:
          WINDOWS_SIGNING_CERTIFICATE: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
          UPDATE_SIGNING_PUBLISHER: ${{ secrets.UPDATE_SIGNING_PUBLISHER }}
        run: |
          $certificate = Join-Path $env:RUNNER_TEMP 'wcode-release-signing.pfx'
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:WINDOWS_SIGNING_CERTIFICATE))
            $signTool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
              Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
            if ([string]::IsNullOrWhiteSpace($signTool)) { throw 'SignTool was not found.' }

            function Sign-And-Verify([string] $file) {
              & $signTool sign /fd SHA256 /td SHA256 /tr $env:TIMESTAMP_URL /f $certificate /p $env:WINDOWS_SIGNING_PASSWORD $file
              if ($LASTEXITCODE -ne 0) { throw "SignTool failed for $file" }
              & $signTool verify /pa /v $file
              if ($LASTEXITCODE -ne 0) { throw "Authenticode verification failed for $file" }
              $signature = Get-AuthenticodeSignature -LiteralPath $file
              if ($signature.Status -ne 'Valid' -or $null -eq $signature.SignerCertificate -or
                  $signature.SignerCertificate.Subject -cne $env:UPDATE_SIGNING_PUBLISHER) {
                throw "Unexpected Authenticode publisher for $file"
              }
            }

            $image = Join-Path $PWD 'release-image\WCode'
            Sign-And-Verify (Join-Path $image 'WCode.exe')
            New-Item -ItemType Directory -Force -Path release | Out-Null
            Copy-Item check-portable.bat $image
            Compress-Archive -Path "$image\*" -DestinationPath release\WCode-portable.zip

            jpackage --type msi --name $env:APP_NAME --app-image $image --dest release `
              --app-version $env:APP_VERSION --vendor $env:APP_VENDOR `
              --win-upgrade-uuid $env:WINDOWS_UPGRADE_UUID --win-menu --win-shortcut --win-per-user-install
            if ($LASTEXITCODE -ne 0) { throw 'MSI creation failed.' }
            $msi = @(Get-ChildItem release -Filter 'WCode*.msi')
            if ($msi.Count -ne 1) { throw 'Expected exactly one MSI.' }
            $msiTarget = Join-Path $PWD 'release\WCode.msi'
            if ($msi[0].FullName -cne $msiTarget) {
              Move-Item -LiteralPath $msi[0].FullName -Destination $msiTarget -Force
            }

            jpackage --type exe --name $env:APP_NAME --app-image $image --dest release `
              --app-version $env:APP_VERSION --vendor $env:APP_VENDOR `
              --win-upgrade-uuid $env:WINDOWS_UPGRADE_UUID --win-menu --win-shortcut --win-per-user-install
            if ($LASTEXITCODE -ne 0) { throw 'EXE creation failed.' }
            $exe = @(Get-ChildItem release -Filter 'WCode*.exe')
            if ($exe.Count -ne 1) { throw 'Expected exactly one EXE.' }
            $exeTarget = Join-Path $PWD 'release\WCode.exe'
            if ($exe[0].FullName -cne $exeTarget) {
              Move-Item -LiteralPath $exe[0].FullName -Destination $exeTarget -Force
            }

            Sign-And-Verify (Join-Path $PWD 'release\WCode.msi')
            Sign-And-Verify (Join-Path $PWD 'release\WCode.exe')
          } finally {
            if (Test-Path $certificate) { Remove-Item $certificate -Force }
          }

      - name: Create signed update manifest and checksums
        shell: pwsh
        env:
          UPDATE_MANIFEST_PRIVATE_KEY: ${{ secrets.UPDATE_MANIFEST_PRIVATE_KEY }}
          UPDATE_MANIFEST_PUBLIC_KEY: ${{ secrets.UPDATE_MANIFEST_PUBLIC_KEY }}
        run: |
          $env:RELEASE_NOTES_JSON = ConvertTo-Json -Compress -InputObject @(
            "WCode $env:APP_VERSION JavaFX with Wildberries and Ozon FBS",
            'Snapshot-first database migration preserves existing user data'
          )
          node tools/update-manifest.mjs release/WCode.msi release/update-manifest.json $env:APP_VERSION
          node --test tools/update-manifest.test.mjs
          $lines = Get-ChildItem release -File | Where-Object Name -ne 'checksums.sha256' | Sort-Object Name | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($_.Name)"
          }
          $lines | Set-Content release\checksums.sha256 -Encoding ascii

      - name: Preserve signed Windows release
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WCode-${{ needs.validate.outputs.tag }}-windows-x64
          path: release/
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified JavaFX release
    if: needs.validate.outputs.should_publish == 'true'
    needs: [validate, windows]
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ needs.validate.outputs.tag }}
      APP_VERSION: ${{ needs.validate.outputs.version }}
    steps:
      - name: Download signed assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: WCode-${{ needs.validate.outputs.tag }}-windows-x64
          path: release

      - name: Verify release inventory
        shell: bash
        run: |
          set -euo pipefail
          for file in WCode.msi WCode.exe WCode-portable.zip update-manifest.json checksums.sha256; do
            test -s "release/$file"
          done
          (cd release && sha256sum --check checksums.sha256)
          test "$(jq -r '.format' release/update-manifest.json)" = 'wcode-update-envelope-v1'

      - name: Publish release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          set -euo pipefail
          notes="WCode ${APP_VERSION} JavaFX — Wildberries và Ozon FBS. Dữ liệu người dùng được snapshot trước migration."
          if gh release view "$RELEASE_TAG" --repo "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --repo "$RELEASE_REPO" --title "WCode $APP_VERSION" --notes "$notes" --latest
          else
            gh release create "$RELEASE_TAG" --repo "$RELEASE_REPO" --title "WCode $APP_VERSION" --notes "$notes" --latest
          fi
          gh release upload "$RELEASE_TAG" --repo "$RELEASE_REPO" release/* --clobber
