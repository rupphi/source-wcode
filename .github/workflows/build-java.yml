name: Build & Test JavaFX Desktop App

on:
  workflow_dispatch:
  push:
    branches: [dev, main, feature/javafx-ozon-1.1.10]
    paths-ignore:
      - README.md
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          java-version: "25"
          distribution: oracle
          cache: maven

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Verify JavaFX production and release contracts
        run: >-
          node --test
          tools/javafx-production-entrypoint.test.mjs
          tools/release-version.test.mjs
          tools/update-manifest.test.mjs

      - name: Run Java and FXML test suite
        shell: pwsh
        run: .\mvnw.cmd -B clean verify

      - name: Build unsigned JavaFX EXE installer
        shell: cmd
        run: build.bat exe

      - name: Verify and name test installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem out -Filter 'WCode*.exe' -File)
          if ($installers.Count -ne 1 -or $installers[0].Length -lt 1MB) {
            throw 'jpackage did not create exactly one non-empty EXE installer.'
          }
          $target = Join-Path $PWD 'out\WCode-1.1.10-Ozon-Test.exe'
          if ($installers[0].FullName -cne $target) {
            Move-Item -LiteralPath $installers[0].FullName -Destination $target -Force
          }
          $hash = (Get-FileHash $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  WCode-1.1.10-Ozon-Test.exe" | Set-Content out\WCode-1.1.10-Ozon-Test.sha256 -Encoding ascii

      - name: Preserve Windows test installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: WCode-1.1.10-Ozon-Test-Windows-x64
          path: |
            out/WCode-1.1.10-Ozon-Test.exe
            out/WCode-1.1.10-Ozon-Test.sha256
          if-no-files-found: error
          retention-days: 14
