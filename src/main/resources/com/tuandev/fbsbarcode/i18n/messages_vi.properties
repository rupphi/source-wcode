znack.help.oms_connection.description=omsConnection định danh kết nối thiết bị SUZ dùng để lấy clientToken động.
znack.help.oms_connection.steps=1. Đăng nhập Честный ЗНАК và mở Quản lý đơn hàng (SUZ).\n2. Mở mục Thiết bị.\n3. Chọn thiết bị dùng cho WCode hoặc tạo/đăng ký thiết bị nếu cần.\n4. Sao chép Mã kết nối vào trường này.
znack.help.oms_connection.recognize=Dùng nguyên giá trị hiển thị tại mục Mã kết nối của thiết bị. Không rút gọn hoặc chỉnh sửa.
