znack.help.oms_id.description=omsId là mã định danh trạm quản lý đơn hàng SUZ. WCode gửi mã này khi tạo đơn KIZ, kiểm tra trạng thái và tải mã.
znack.help.oms_id.steps=1. Đăng nhập Честный ЗНАК bằng chứng thư dùng cho cửa hàng này.\n2. Mở Quản lý đơn hàng (SUZ).\n3. Mở cài đặt SUZ hoặc hồ sơ trạm rồi sao chép omsId hiển thị tại đó.\n4. Nếu tài khoản không hiển thị omsId, hãy yêu cầu bộ phận hỗ trợ kỹ thuật Честный ЗНАК cung cấp.
znack.help.oms_id.recognize=Giá trị thường có dạng UUID, ví dụ: cdf12109-10d3-11e6-8b6f-0050569977a1. Sao chép đầy đủ và không thêm khoảng trắng.
